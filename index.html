// Recommends a Good / Better / Best window of 3 adjacent plan tiers based on
// the practice's current annual case starts. The window is centered on the
// tier that roughly matches the practice's volume, then clamped so it always
// stays within the 5 available tiers (e.g. a very high-volume practice still
// tops out at the 200+ tier, since that's the largest plan offered).
const getRecommendedVipTiers = (annualStarts) => {
  let center;
  if (annualStarts < 40) center = 1; // 10+ / 30+ / 50+
  else if (annualStarts < 100) center = 2; // 30+ / 50+ / 100+
  else center = 3; // 50+ / 100+ / 200+
  const startIdx = Math.min(Math.max(center - 1, 0), VIP_PLAN.length - 3);
  return [0, 1, 2].map((offset) => VIP_PLAN[startIdx + offset]);
};

const fmt = (n, dec = 0) =>
  n != null && !isNaN(n)
    ? Number(n).toLocaleString("en-US", {
        minimumFractionDigits: dec,
        maximumFractionDigits: dec,
      })
    : "—";
const fmtCurrency = (n) => (n != null && !isNaN(n) ? `$${fmt(n)}` : "—");
const fmtPct = (n, dec = 1) =>

const SliderField = ({ label, value, onChange, min, max, step = 1, prefix, suffix, tooltip }) => {
  const pct = ((value - min) / (max - min)) * 100;
  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
        <label style={{ fontSize: 11, fontWeight: 600, color: BRAND.muted, letterSpacing: "0.04em", textTransform: "uppercase" }}>
          {label}
          {tooltip && <span title={tooltip} style={{ marginLeft: 5, cursor: "help", color: BRAND.aquaText, fontSize: 10 }}>ⓘ</span>}
        </label>
        <span style={{ fontSize: 18, fontWeight: 700, color: BRAND.mintText, fontFamily: "'DM Sans', sans-serif" }}>
          {prefix}{typeof value === 'number' ? value.toLocaleString() : value}{suffix}
        </span>
      </div>
      <div style={{ position: "relative", height: 28, display: "flex", alignItems: "center" }}>
        <div style={{ position: "absolute", left: 0, right: 0, height: 6, background: "rgba(126,218,176,0.08)", borderRadius: 3 }}>
          <div style={{ height: "100%", width: `${pct}%`, background: BRAND.gradient, borderRadius: 3, transition: "width 0.15s ease" }} />
        </div>
        <input
          type="range"
          min={min}
          max={max}
          step={step}
          value={value}
          onChange={(e) => onChange(Number(e.target.value))}
          style={{
            position: "absolute", left: 0, right: 0, width: "100%", height: 28,
            WebkitAppearance: "none", appearance: "none", background: "transparent",
            cursor: "pointer", margin: 0, outline: "none", zIndex: 2,
          }}
        />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "rgba(61,90,102,0.65)", marginTop: 2 }}>
        <span>{prefix}{min.toLocaleString()}{suffix}</span>
        <span>{prefix}{max.toLocaleString()}{suffix}</span>
      </div>
      <style>{`
        input[type=range]::-webkit-slider-thumb {
          -webkit-appearance: none; appearance: none;
          width: 20px; height: 20px; border-radius: 50%;
          background: linear-gradient(135deg, #7EDAB0, #5BC4C4);
          border: 2px solid rgba(11,26,31,0.8);

          cursor: pointer;

const CompRow = ({ label, baseline, alignerBaseline, scenarios, format = "number" }) => {
  const formatVal = (v) => {
    if (v == null || isNaN(v)) return "—";
    if (format === "currency") return fmtCurrency(v);
    if (format === "percent") return fmtPct(v);
    if (format === "decimal1") return fmt(v, 1);
    return fmt(v);
  };
  return (
    <tr>
      <td
        style={{
          padding: "10px 12px",
          fontSize: 13,
          color: BRAND.muted,
          borderBottom: "1px solid rgba(126,218,176,0.06)",
          fontWeight: 500,
        }}
      >
        {label}
      </td>
      <td
        style={{
          padding: "10px 12px",
          fontSize: 14,
          color: BRAND.white,
          fontWeight: 600,
          textAlign: "right",
          borderBottom: "1px solid rgba(126,218,176,0.06)",
          fontFamily: "'DM Sans', sans-serif",
        }}
      >
        {formatVal(baseline)}
      </td>
      {alignerBaseline !== undefined && (
        <td
          style={{
            padding: "10px 12px",
            fontSize: 14,
            color: BRAND.seafoamText,
            fontWeight: 600,
            textAlign: "right",
            borderBottom: "1px solid rgba(126,218,176,0.06)",
            fontFamily: "'DM Sans', sans-serif",
          }}
        >
          {formatVal(alignerBaseline)}
        </td>
      )}
      {scenarios.map((s, i) => (
        <td
          key={i}
          style={{
            padding: "10px 12px",
            fontSize: 14,
            color: i === scenarios.length - 1 ? BRAND.chartreuseText : BRAND.mintText,
            fontWeight: 600,
            textAlign: "right",
            borderBottom: "1px solid rgba(126,218,176,0.06)",
            fontFamily: "'DM Sans', sans-serif",
          }}
        >
          {formatVal(s)}
        </td>
      ))}
    </tr>
  );
};

// ═════════════════════════════════════════════════════════════════
// MAIN COMPONENT
// ═════════════════════════════════════════════════════════════════
function LightForceCalculator() {
  const [tab, setTab] = useState("calculator");
  const [animate, setAnimate] = useState(false);
  const [emailModal, setEmailModal] = useState(false);
  const [emailTo, setEmailTo] = useState("");
  const [emailSubject, setEmailSubject] = useState("LightForce Treatment Efficiency Report");
  const [emailNote, setEmailNote] = useState("");
  const [emailStatus, setEmailStatus] = useState("idle"); // idle | sending | sent | error
  const [emailError, setEmailError] = useState("");
  const [practiceName, setPracticeName] = useState("");

  // ── Inputs (from the Inputs tab of the spreadsheet) ──
  const [inputs, setInputs] = useState({
    patientsPerDay: 80,
    avgTreatmentFee: 6000,
    lfTreatmentFee: 6000, // LightForce (Generative Braces) treatment fee — independently editable, defaults to Avg Treatment Fee
    startsPerYear: 450,
    avgTxDuration: 24,
    avgVisits: 18,
    lfVisits: 12,
    // Appointment Durations (internal)
    initialConsult: 60,
    preBonding: 30,
    bonding: 60,
    interval: 30,
    finishing: 30,
    debond: 60,
    // Financial
    avgFeeAdjustment: 0.05,
    // Schedule
    monthlyClinicDays: 16,
    // Patient Conversion
    conversionLift: 5, // Generative Braces Conversion Lift Assumption (percentage points above Gaidge baseline)
  });

  // Fixed constants
  const CLINICAL_HOURS = 8;

  const update = (key) => (val) =>
    setInputs((p) => ({ ...p, [key]: val }));

  useEffect(() => {
    setAnimate(true);
    const t = setTimeout(() => setAnimate(false), 600);
    return () => clearTimeout(t);
  }, [inputs]);

  // Keep LightForce Visits within its dynamic max (avgVisits - 1) whenever
  // Avg Visits is lowered, so the LF Visits slider never renders out of range.
  useEffect(() => {
    const maxLfVisits = Math.max(8, inputs.avgVisits - 1);
    if (inputs.lfVisits > maxLfVisits) {
      setInputs((p) => ({ ...p, lfVisits: maxLfVisits }));
    }
  }, [inputs.avgVisits]);

  // ── Derived Calculations ──
  const calc = useMemo(() => {
    const i = inputs;
    const patientsPerDay = i.patientsPerDay;
    const apptCapDay = patientsPerDay;
    const apptCapMonth = apptCapDay * i.monthlyClinicDays;
    const activePatients = (i.startsPerYear / 12) * i.avgTxDuration;
    const totalApptsMonth = activePatients * (i.avgVisits / i.avgTxDuration);

    const reductions = [0.2, 0.4];
    const lfVisitsClamped = Math.min(Math.max(i.lfVisits, 1), i.avgVisits - 0.1);
    const lfReduction = (i.avgVisits - lfVisitsClamped) / i.avgVisits;
    const allScenarios = [...reductions, lfReduction];
    const scenarios = allScenarios.map((r, idx) => {
      const newDuration = i.avgTxDuration * (1 - r);
      const newVisits = i.avgVisits * (1 - r);

      // Total time per patient (current)
      const currentTotalTime =
        i.initialConsult +
        i.preBonding +
        i.bonding +
        i.interval * (i.avgVisits - 3) +
        i.finishing +
        i.debond;

      // LF model
      const lfIntervalTime = i.interval * 0.5;
      const lfVisits = Math.round(newVisits);
      const lfTotalTime =
        i.initialConsult * 0.75 +
        i.preBonding * 0.5 +
        i.bonding +
        lfIntervalTime * Math.max(0, lfVisits - 3) +
        i.debond;

      const apptsSavedMonth =
        (i.startsPerYear / 12) * (i.avgVisits - newVisits);
      const apptsSavedYear = apptsSavedMonth * 12;

      const apptsSavedPerDay = apptsSavedMonth / i.monthlyClinicDays;
      const reducedPatientsPerDay = Math.max(0, patientsPerDay - apptsSavedPerDay);

      const avgApptMinutes = (CLINICAL_HOURS * 60) / patientsPerDay;
      const hoursSavedMonth = apptsSavedMonth * (avgApptMinutes / 60);
      const hoursSavedYear = hoursSavedMonth * 12;
      const clinicDaysSavedYear = hoursSavedYear / CLINICAL_HOURS;
      const clinicDaysFreedYear = apptsSavedYear / patientsPerDay;

      const avgCollection = i.avgTreatmentFee * (1 - i.avgFeeAdjustment);
      const lfCollection = i.lfTreatmentFee * (1 - i.avgFeeAdjustment);
      const valuePerVisitBaseline = avgCollection / i.avgVisits;
      const valuePerVisitNew = lfCollection / newVisits;
      const profitPerVisitDelta = valuePerVisitNew - valuePerVisitBaseline;

      const extraStarts = apptsSavedYear / i.avgVisits;
      const extraRevenue = extraStarts * i.lfTreatmentFee;

      const profitPerPatient = i.avgTreatmentFee;
      const lfProfitPerPatient = i.lfTreatmentFee;
      const currentProfitPerVisit = profitPerPatient / i.avgVisits;
      const lfProfitPerVisit = lfProfitPerPatient / newVisits;
      const currentProfitPerHour = profitPerPatient / (currentTotalTime / 60);
      const lfProfitPerHour = lfProfitPerPatient / (lfTotalTime / 60);

      const isLF = idx === 2;
      const label = isLF
        ? `LF (${Number.isInteger(lfVisitsClamped) ? lfVisitsClamped : lfVisitsClamped.toFixed(1)} visits)`
        : `${Math.round(r * 100)}% Shorter`;
      const shortLabel = isLF ? "LightForce" : `${Math.round(r * 100)}%`;

      return {
        reduction: r,
        isLF,
        label,
        shortLabel,
        newDuration,
        newVisits,
        apptsSavedMonth,
        apptsSavedPerDay,
        reducedPatientsPerDay,
        hoursSavedMonth,
        apptsSavedYear,
        hoursSavedYear,
        clinicDaysSavedYear,
        clinicDaysFreedYear,
        valuePerVisitNew,
        profitPerVisitDelta,
        extraStarts,
        extraRevenue,
        currentTotalTime,
        lfTotalTime,
        profitPerPatient,
        lfProfitPerPatient,
        currentProfitPerVisit,
        lfProfitPerVisit,
        currentProfitPerHour,
        lfProfitPerHour,
      };
    });

    // The "best" scenario is whichever option actually yields the highest
    // value per visit (and therefore the highest extra profit per day, since
    // profit/day is just value-per-visit-delta × 5 — a fixed multiplier).
    // This is NOT always the LightForce scenario: depending on the LF Visits
    // slider, a 20% or 40% Shorter preset can outperform it.
    const bestIdx = scenarios.reduce(
      (bestI, s, idx) => (s.valuePerVisitNew > scenarios[bestI].valuePerVisitNew ? idx : bestI),
      0
    );
    scenarios.forEach((s, idx) => { s.isBest = idx === bestIdx; });

    const avgCollection = i.avgTreatmentFee * (1 - i.avgFeeAdjustment);
    const valuePerVisitBaseline = avgCollection / i.avgVisits;

    // ── Patient Conversion Impact ──
    // The Gaidge industry baseline conversion rate represents the share of
    // consultations that become starts. The Conversion Lift Assumption models
    // how many additional percentage points Generative Braces adds on top of
    // that baseline (e.g. an easier case-acceptance conversation, a more
    // compelling treatment experience, etc). Since starts/year is already an
    // input, we scale it proportionally to the improved conversion rate,
    // holding the number of consultations/leads constant.
    const conversionBaseline = GAIDGE_BENCHMARKS.conversionBaseline;
    const lfConversionRate = conversionBaseline + i.conversionLift;
    const conversionExtraStarts = i.startsPerYear * (i.conversionLift / conversionBaseline);
    const newStartsPerYear = i.startsPerYear + conversionExtraStarts;
    const conversionExtraRevenue = conversionExtraStarts * i.lfTreatmentFee;
    const lfFeeDelta = i.lfTreatmentFee - i.avgTreatmentFee;

    return {
      patientsPerDay,
      apptCapDay,
      apptCapMonth,
      activePatients,
      totalApptsMonth,
      valuePerVisitBaseline,
      avgCollection,
      scenarios,
      conversionBaseline,
      lfConversionRate,
      conversionExtraStarts,
      newStartsPerYear,
      conversionExtraRevenue,
      lfFeeDelta,
    };

    if (!emailTo.trim()) { setEmailError("Please enter a recipient email."); return; }
    setEmailStatus("sending");

    try {
      const htmlBody = buildEmailBody();
      const prompt = `Send an email using Gmail with the following details:
To: ${emailTo.trim()}
Subject: ${emailSubject}
Body (send as HTML email): 
${htmlBody}

Please send this email now. The body is HTML formatted and should be sent as an HTML email, not plain text.`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }],
          mcp_servers: [{ type: "url", url: "https://gmail.mcp.claude.com/mcp", name: "gmail-mcp" }],
        }),
      });
      const data = await response.json();
      
      const hasError = data.content?.some(
        (b) => b.type === "text" && (b.text?.toLowerCase().includes("error") || b.text?.toLowerCase().includes("failed"))
      );
      const hasToolResult = data.content?.some((b) => b.type === "mcp_tool_result");
      
      if (hasToolResult || (data.content && !hasError)) {
        setEmailStatus("sent");
        setTimeout(() => { setEmailModal(false); setEmailStatus("idle"); setEmailTo(""); setEmailNote(""); }, 2500);
      } else {
        setEmailStatus("error");
        setEmailError("Could not send email. Please check your Gmail connection.");
      }
    } catch (err) {
      console.error("Email send error:", err);
      setEmailStatus("error");
      setEmailError("Failed to send email. Please try again.");

                  <span style={{ display: "inline-block", animation: "spin 1s linear infinite", fontSize: 16 }}>⟳</span>
                )}
                {emailStatus === "idle" || emailStatus === "error" ? "Send Email Report" : emailStatus === "sending" ? "Sending via Gmail..." : "✓ Sent!"}
              </button>

              <style>{`@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`}</style>
            </div>
          </div>
        </div>
      )}

      {/* ── Footer ── */}
      <div
        style={{
          borderTop: "1px solid rgba(126,218,176,0.08)",
          padding: "20px 24px",

          <br />
          Results are estimates and will vary by practice.
        </div>

}
