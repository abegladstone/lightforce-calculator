const fmt = (n, dec = 0) =>
  n != null && !isNaN(n)
    ? Number(n).toLocaleString("en-US", {
        minimumFractionDigits: dec,
        maximumFractionDigits: dec,
      })
    : "—";
const fmtCurrency = (n) => (n != null && !isNaN(n) ? `$${fmt(n)}` : "—");
const fmtPct = (n, dec = 1) =>

const LightForceLogo = ({ height = 36 }) => (
  <img src={LF_LOGO} alt="LightForce" style={{ height, objectFit: "contain" }} />
);

// ─── Input Field Component ──────────────────────────────────────
const SliderField = ({ label, value, onChange, min, max, step = 1, prefix, suffix, tooltip }) => {
  const pct = ((value - min) / (max - min)) * 100;
  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
        <label style={{ fontSize: 11, fontWeight: 600, color: BRAND.muted, letterSpacing: "0.04em", textTransform: "uppercase" }}>
          {label}
          {tooltip && <span title={tooltip} style={{ marginLeft: 5, cursor: "help", color: BRAND.aqua, fontSize: 10 }}>ⓘ</span>}
        </label>
        <span style={{ fontSize: 18, fontWeight: 700, color: BRAND.mint, fontFamily: "'DM Sans', sans-serif" }}>
          {prefix}{typeof value === 'number' ? value.toLocaleString() : value}{suffix}
        </span>
      </div>
      <div style={{ position: "relative", height: 28, display: "flex", alignItems: "center" }}>
        <div style={{ position: "absolute", left: 0, right: 0, height: 6, background: "rgba(126,218,176,0.08)", borderRadius: 3 }}>
          <div style={{ height: "100%", width: `${pct}%`, background: BRAND.gradient, borderRadius: 3, transition: "width 0.15s ease" }} />
        </div>
        <input
          type="range"
          min={min}
          max={max}
          step={step}
          value={value}
          onChange={(e) => onChange(Number(e.target.value))}
          style={{
            position: "absolute", left: 0, right: 0, width: "100%", height: 28,
            WebkitAppearance: "none", appearance: "none", background: "transparent",
            cursor: "pointer", margin: 0, outline: "none", zIndex: 2,
          }}
        />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "rgba(139,168,180,0.5)", marginTop: 2 }}>
        <span>{prefix}{min.toLocaleString()}{suffix}</span>
        <span>{prefix}{max.toLocaleString()}{suffix}</span>
      </div>
      <style>{`
        input[type=range]::-webkit-slider-thumb {
          -webkit-appearance: none; appearance: none;
          width: 20px; height: 20px; border-radius: 50%;
          background: linear-gradient(135deg, #7EDAB0, #5BC4C4);
          border: 2px solid rgba(11,26,31,0.8);
          box-shadow: 0 2px 8px rgba(126,218,176,0.3);
          cursor: pointer;
        }
        input[type=range]::-moz-range-thumb {
          width: 18px; height: 18px; border-radius: 50%;
          background: linear-gradient(135deg, #7EDAB0, #5BC4C4);
          border: 2px solid rgba(11,26,31,0.8);
          box-shadow: 0 2px 8px rgba(126,218,176,0.3);
          cursor: pointer;
        }
      `}</style>
    </div>
  );
};

// ─── Stat Card ──────────────────────────────────────────────────
const StatCard = ({ label, value, sub, accent, large }) => (
  <div
    style={{
      background: BRAND.cardBg,
      border: `1px solid rgba(126,218,176,0.12)`,
      borderRadius: 12,
      padding: large ? "20px 18px" : "14px 16px",
      backdropFilter: "blur(10px)",
      flex: 1,
      minWidth: 140,
    }}
  >
    <div
      style={{
        fontSize: 11,
        color: BRAND.muted,
        textTransform: "uppercase",
        letterSpacing: "0.06em",
        marginBottom: 6,
        fontWeight: 500,
      }}
    >
      {label}
    </div>
    <div
      style={{
        fontSize: large ? 28 : 22,
        fontWeight: 700,
        color: accent || BRAND.mint,
        lineHeight: 1.1,
        fontFamily: "'DM Sans', sans-serif",
      }}
    >
      {value}
    </div>
    {sub && (
      <div style={{ fontSize: 12, color: BRAND.muted, marginTop: 4 }}>
        {sub}
      </div>
    )}
  </div>
);

// ─── Mini Bar Chart ─────────────────────────────────────────────
const MiniBar = ({ data, maxVal, color, label, valueLabel }) => {
  const pct = maxVal > 0 ? (data / maxVal) * 100 : 0;
  return (
    <div style={{ marginBottom: 10 }}>
      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          fontSize: 12,
          color: BRAND.muted,
          marginBottom: 4,
        }}
      >
        <span>{label}</span>
        <span style={{ color: BRAND.white, fontWeight: 600 }}>
          {valueLabel}
        </span>
      </div>
      <div
        style={{
          height: 6,
          background: "rgba(126,218,176,0.1)",
          borderRadius: 3,
          overflow: "hidden",
        }}
      >
        <div
          style={{
            height: "100%",
            width: `${Math.min(pct, 100)}%`,
            background: color || BRAND.gradient,
            borderRadius: 3,
            transition: "width 0.6s ease",
          }}
        />
      </div>
    </div>
  );
};

// ─── Tab Button ─────────────────────────────────────────────────
const TabBtn = ({ active, onClick, children, icon }) => (
  <button
    onClick={onClick}
    style={{
      background: active
        ? "linear-gradient(135deg, rgba(126,218,176,0.2), rgba(91,196,196,0.15))"
        : "transparent",
      border: active
        ? "1px solid rgba(126,218,176,0.35)"
        : "1px solid transparent",
      borderRadius: 10,
      padding: "10px 18px",
      color: active ? BRAND.mint : BRAND.muted,
      fontSize: 13,
      fontWeight: active ? 600 : 500,
      cursor: "pointer",
      transition: "all 0.25s",
      fontFamily: "'DM Sans', sans-serif",
      display: "flex",
      alignItems: "center",
      gap: 7,
      whiteSpace: "nowrap",
    }}
  >
    <span style={{ fontSize: 16 }}>{icon}</span>
    {children}
  </button>
);

// ─── Section Header ─────────────────────────────────────────────
const SectionHeader = ({ title, subtitle }) => (
  <div style={{ marginBottom: 20 }}>
    <h3
      style={{
        margin: 0,
        fontSize: 18,
        fontWeight: 700,
        color: BRAND.white,
        fontFamily: "'DM Sans', sans-serif",
      }}
    >
      {title}
    </h3>
    {subtitle && (
      <p
        style={{
          margin: "4px 0 0",
          fontSize: 13,
          color: BRAND.muted,
          lineHeight: 1.5,
        }}
      >
        {subtitle}
      </p>
    )}
  </div>
);

// ─── Comparison Table Row ───────────────────────────────────────
const CompRow = ({ label, baseline, scenarios, format = "number" }) => {
  const formatVal = (v) => {
    if (v == null || isNaN(v)) return "—";
    if (format === "currency") return fmtCurrency(v);
    if (format === "percent") return fmtPct(v);
    if (format === "decimal1") return fmt(v, 1);
    return fmt(v);
  };
  return (
    <tr>
      <td
        style={{
          padding: "10px 12px",
          fontSize: 13,
          color: BRAND.muted,
          borderBottom: "1px solid rgba(126,218,176,0.06)",
          fontWeight: 500,
        }}
      >
        {label}
      </td>
      <td
        style={{
          padding: "10px 12px",
          fontSize: 14,
          color: BRAND.white,

  // ── Inputs (from the Inputs tab of the spreadsheet) ──
  const [inputs, setInputs] = useState({
    patientsPerDay: 80,
    avgTreatmentFee: 9000,
    startsPerYear: 450,
    avgTxDuration: 24,
    avgVisits: 18,
    lfVisits: 12,
    // Appointment Durations (internal)
    initialConsult: 60,
    preBonding: 30,
    bonding: 60,
    interval: 30,
    finishing: 30,
    debond: 60,
    // Financial
    avgFeeAdjustment: 0.05,
    // Schedule
    monthlyClinicDays: 16,
  });

  // Fixed constants
  const CLINICAL_HOURS = 8;

  const update = (key) => (val) =>
    setInputs((p) => ({ ...p, [key]: val }));

  useEffect(() => {
    setAnimate(true);
    const t = setTimeout(() => setAnimate(false), 600);
    return () => clearTimeout(t);
  }, [inputs]);

  // ── Derived Calculations ──
  const calc = useMemo(() => {
    const i = inputs;
    const patientsPerDay = i.patientsPerDay;
    const apptCapDay = patientsPerDay;
    const apptCapMonth = apptCapDay * i.monthlyClinicDays;
    const activePatients = (i.startsPerYear / 12) * i.avgTxDuration;
    const totalApptsMonth = activePatients * (i.avgVisits / i.avgTxDuration);

    const reductions = [0.2, 0.4];
    const lfVisitsClamped = Math.min(Math.max(i.lfVisits, 1), i.avgVisits - 0.1);
    const lfReduction = (i.avgVisits - lfVisitsClamped) / i.avgVisits;
    const allScenarios = [...reductions, lfReduction];
    const scenarios = allScenarios.map((r, idx) => {
      const newDuration = i.avgTxDuration * (1 - r);
      const newVisits = i.avgVisits * (1 - r);

      // Total time per patient (current)
      const currentTotalTime =
        i.initialConsult +
        i.preBonding +
        i.bonding +
        i.interval * (i.avgVisits - 3) +
        i.finishing +
        i.debond;

      // LF model
      const lfIntervalTime = i.interval * 0.5;
      const lfVisits = Math.round(newVisits);
      const lfTotalTime =
        i.initialConsult * 0.75 +
        i.preBonding * 0.5 +
        i.bonding +
        lfIntervalTime * Math.max(0, lfVisits - 3) +
        i.debond;

      const apptsSavedMonth =
        (i.startsPerYear / 12) * (i.avgVisits - newVisits);
      const apptsSavedYear = apptsSavedMonth * 12;

      const apptsSavedPerDay = apptsSavedMonth / i.monthlyClinicDays;
      const reducedPatientsPerDay = Math.max(0, patientsPerDay - apptsSavedPerDay);

      const avgApptMinutes = (CLINICAL_HOURS * 60) / patientsPerDay;
      const hoursSavedMonth = apptsSavedMonth * (avgApptMinutes / 60);
      const hoursSavedYear = hoursSavedMonth * 12;
      const clinicDaysSavedYear = hoursSavedYear / CLINICAL_HOURS;
      const clinicDaysFreedYear = apptsSavedYear / patientsPerDay;

      const avgCollection = i.avgTreatmentFee * (1 - i.avgFeeAdjustment);
      const valuePerVisitBaseline = avgCollection / i.avgVisits;
      const valuePerVisitNew = avgCollection / newVisits;
      const profitPerVisitDelta = valuePerVisitNew - valuePerVisitBaseline;

      const extraStarts = apptsSavedYear / i.avgVisits;
      const extraRevenue = extraStarts * i.avgTreatmentFee;

      const profitPerPatient = i.avgTreatmentFee;
      const lfProfitPerPatient = i.avgTreatmentFee;
      const currentProfitPerVisit = profitPerPatient / i.avgVisits;
      const lfProfitPerVisit = lfProfitPerPatient / newVisits;
      const currentProfitPerHour = profitPerPatient / (currentTotalTime / 60);
      const lfProfitPerHour = lfProfitPerPatient / (lfTotalTime / 60);

      const isLF = idx === 2;
      const label = isLF
        ? `LF (${Number.isInteger(lfVisitsClamped) ? lfVisitsClamped : lfVisitsClamped.toFixed(1)} visits)`
        : `${Math.round(r * 100)}% Shorter`;
      const shortLabel = isLF ? "LightForce" : `${Math.round(r * 100)}%`;

      return {
        reduction: r,
        isLF,
        label,
        shortLabel,
        newDuration,
        newVisits,
        apptsSavedMonth,
        apptsSavedPerDay,
        reducedPatientsPerDay,
        hoursSavedMonth,
        apptsSavedYear,
        hoursSavedYear,
        clinicDaysSavedYear,
        clinicDaysFreedYear,
        valuePerVisitNew,
        profitPerVisitDelta,
        extraStarts,
        extraRevenue,
        currentTotalTime,
        lfTotalTime,
        profitPerPatient,
        lfProfitPerPatient,
        currentProfitPerVisit,
        lfProfitPerVisit,
        currentProfitPerHour,
        lfProfitPerHour,
      };
    });

    const avgCollection = i.avgTreatmentFee * (1 - i.avgFeeAdjustment);
    const valuePerVisitBaseline = avgCollection / i.avgVisits;

    return {
      patientsPerDay,
      apptCapDay,
      apptCapMonth,
      activePatients,
      totalApptsMonth,
      valuePerVisitBaseline,
      avgCollection,
      scenarios,
    };
  }, [inputs]);

To: ${emailTo.trim()}

Body (send as HTML email): 
${htmlBody}

Please send this email now. The body is HTML formatted and should be sent as an HTML email, not plain text.`;

        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }],
          mcp_servers: [{ type: "url", url: "https://gmail.mcp.claude.com/mcp", name: "gmail-mcp" }],
        }),
      });
      const data = await response.json();
      
      const hasError = data.content?.some(
        (b) => b.type === "text" && (b.text?.toLowerCase().includes("error") || b.text?.toLowerCase().includes("failed"))
      );
      const hasToolResult = data.content?.some((b) => b.type === "mcp_tool_result");
      
      if (hasToolResult || (data.content && !hasError)) {

        setTimeout(() => { setEmailModal(false); setEmailStatus("idle"); setEmailTo(""); setEmailNote(""); }, 2500);

                              color: BRAND.muted,
                              transform: "rotate(-45deg)",
                              whiteSpace: "nowrap",
                            }}
                          >
                            {pct.toFixed(1)}%
                          </div>
                          <div
                            style={{
                              width: "100%",
                              maxWidth: 28,
                              height: `${pct * 14}px`,
                              background:
                                pct > 8
                                  ? `linear-gradient(180deg, ${BRAND.coral}, #FF8E8E)`
                                  : BRAND.gradient,
                              borderRadius: "4px 4px 0 0",
                              transition: "height 0.4s ease",
                              minHeight: 4,
                            }}
                          />
                        </div>
                      );
                    })}
                  </div>
                  <div
                    style={{
                      display: "flex",
                      gap: 3,
                      padding: "6px 4px 0",
                    }}
                  >
                    {GAIDGE_BENCHMARKS.emergencyTrends.map((d, i) => (
                      <div
                        key={i}
                        style={{
                          flex: 1,
                          fontSize: 8,
                          color: BRAND.muted,
                          textAlign: "center",
                          lineHeight: 1.2,
                        }}
                      >
                        {d.month.split(" ")[0]}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Summary Stats */}
                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "1fr 1fr",
                    gap: 10,
                  }}
                >
                  <div
                    style={{
                      background: "rgba(126,218,176,0.06)",
                      borderRadius: 10,
                      padding: "12px 14px",
                      border: "1px solid rgba(126,218,176,0.08)",
                    }}
                  >
                    <div
                      style={{
                        fontSize: 10,
                        color: BRAND.muted,
                        textTransform: "uppercase",
                        letterSpacing: "0.05em",
                      }}
                    >
                      Avg Emergency Rate
                    </div>
                    <div
                      style={{
                        fontSize: 20,
                        fontWeight: 700,
                        color: BRAND.aqua,
                        marginTop: 2,
                      }}
                    >
                      {fmtPct(avgEmergencyRate)}
                    </div>
                  </div>
                  <div
                    style={{
                      background: "rgba(126,218,176,0.06)",
                      borderRadius: 10,
                      padding: "12px 14px",
                      border: "1px solid rgba(126,218,176,0.08)",
                    }}
                  >
                    <div
                      style={{
                        fontSize: 10,
                        color: BRAND.muted,
                        textTransform: "uppercase",
                        letterSpacing: "0.05em",
                      }}
                    >
                      Avg Monthly ER Visits
                    </div>
                    <div
                      style={{
                        fontSize: 20,
                        fontWeight: 700,
                        color: BRAND.aqua,
                        marginTop: 2,
                      }}
                    >
                      {Math.round(
                        GAIDGE_BENCHMARKS.emergencyTrends.reduce(
                          (s, d) => s + d.emergency,
                          0
                        ) / GAIDGE_BENCHMARKS.emergencyTrends.length
                      )}
                    </div>
                  </div>
                </div>

                {/* LF Impact Note */}
                <div
                  style={{
                    marginTop: 16,
                    padding: "12px 16px",
                    background: "rgba(240,199,94,0.06)",
                    border: "1px solid rgba(240,199,94,0.15)",
                    borderRadius: 10,
                  }}
                >
                  <div
                    style={{
                      fontSize: 12,
                      color: BRAND.gold,
                      fontWeight: 600,
                      marginBottom: 4,
                    }}
                  >
                    LightForce Impact on Emergencies
                  </div>
                  <div
                    style={{
                      fontSize: 12,
                      color: BRAND.muted,
                      lineHeight: 1.5,
                    }}
                  >
                    Custom 3D-printed brackets reduce bracket failures
                    and emergency visits. LightForce practices typically
                    see significantly fewer unscheduled appointments,
                    freeing chair time for productive visits.
                  </div>
                </div>
              </div>
            </div>

            {/* Full Benchmark Comparison */}
            <div
              style={{
                background: BRAND.cardBg,
                border: "1px solid rgba(126,218,176,0.1)",
                borderRadius: 16,
                padding: 24,
                backdropFilter: "blur(10px)",
              }}
            >
              <SectionHeader
                title="Your Practice vs Gaidge Benchmarks with LightForce"
                subtitle="See how LightForce efficiency gains compare to industry benchmarks across treatment types"
              />

              <div style={{ overflowX: "auto" }}>
                <table
                  style={{
                    width: "100%",
                    borderCollapse: "collapse",
                  }}
                >
                  <thead>
                    <tr>
                      {[
                        "",
                        "Gaidge Avg",
                        "Your Practice",
                        "With LF (20%)",
                        "With LF (40%)",
                        `LightForce (${inputs.lfVisits} visits)`,
                      ].map((h, i) => (
                        <th
                          key={h}
                          style={{
                            textAlign: i === 0 ? "left" : "right",
                            padding: "10px 12px",
                            fontSize: 11,
                            color:
                              i === 5 ? BRAND.gold : i >= 3 ? BRAND.mint : BRAND.muted,
                            textTransform: "uppercase",
                            letterSpacing: "0.06em",
                            borderBottom: `2px solid rgba(126,218,176,0.15)`,
                            fontWeight: 600,
                          }}
                        >
                          {h}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    <CompRow
                      label="Treatment Duration (months)"
                      baseline={26}
                      scenarios={[
                        inputs.avgTxDuration,
                        calc.scenarios[0].newDuration,
                        calc.scenarios[1].newDuration,
                        calc.scenarios[2].newDuration,
                      ]}
                      format="decimal1"
                    />
                    <CompRow
                      label="Total Visits"
                      baseline={19}
                      scenarios={[
                        inputs.avgVisits,
                        calc.scenarios[0].newVisits,
                        calc.scenarios[1].newVisits,
                        calc.scenarios[2].newVisits,
                      ]}
                      format="decimal1"
                    />
                    <CompRow
                      label="Value per Visit"
                      baseline={391}
                      scenarios={[
                        calc.valuePerVisitBaseline,
                        calc.scenarios[0].valuePerVisitNew,
                        calc.scenarios[1].valuePerVisitNew,
                        calc.scenarios[2].valuePerVisitNew,
                      ]}
                      format="currency"
                    />
                    <CompRow
                      label="Appts Saved / Year"
                      baseline={"—"}
                      scenarios={[
                        "—",
                        calc.scenarios[0].apptsSavedYear,
                        calc.scenarios[1].apptsSavedYear,
                        calc.scenarios[2].apptsSavedYear,
                      ]}
                    />
                    <CompRow
                      label="Extra Revenue / Year"
                      baseline={"—"}
                      scenarios={[
                        "—",
                        calc.scenarios[0].extraRevenue,
                        calc.scenarios[1].extraRevenue,
                        calc.scenarios[2].extraRevenue,
                      ]}
                      format="currency"
                    />
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* ── Email Modal ── */}
      {emailModal && (
        <div
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(0,0,0,0.7)",
            backdropFilter: "blur(6px)",
            zIndex: 1000,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            padding: 20,
          }}
          onClick={(e) => { if (e.target === e.currentTarget && emailStatus !== "sending") setEmailModal(false); }}
        >
          <div
            style={{
              background: `linear-gradient(165deg, ${BRAND.navy}, ${BRAND.dark})`,
              border: "1px solid rgba(126,218,176,0.2)",
              borderRadius: 18,
              padding: 0,
              width: "100%",
              maxWidth: 560,
              maxHeight: "90vh",
              overflow: "auto",
              boxShadow: "0 24px 80px rgba(0,0,0,0.5)",
            }}
          >
            {/* Modal Header */}
            <div
              style={{
                padding: "22px 28px 16px",
                borderBottom: "1px solid rgba(126,218,176,0.1)",
                display: "flex",
                alignItems: "center",
                justifyContent: "space-between",
              }}
            >
              <div>
                <h2
                  style={{
                    margin: 0,
                    fontSize: 18,
                    fontWeight: 700,
                    color: BRAND.white,
                    fontFamily: "'DM Sans', sans-serif",
                    display: "flex",
                    alignItems: "center",
                    gap: 8,
                  }}
                >
                  <span style={{ fontSize: 20 }}>✉</span> Email Efficiency Report
                </h2>
                <p style={{ margin: "4px 0 0", fontSize: 12, color: BRAND.muted }}>
                  Send the 40% reduction scenario with your practice inputs
                </p>
              </div>
              <button
                onClick={() => emailStatus !== "sending" && setEmailModal(false)}
                style={{
                  background: "rgba(126,218,176,0.1)",
                  border: "1px solid rgba(126,218,176,0.15)",
                  borderRadius: 8,
                  width: 32,
                  height: 32,
                  color: BRAND.muted,
                  fontSize: 16,
                  cursor: "pointer",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                }}
              >
                ✕
              </button>
            </div>

            {/* Modal Body */}
            <div style={{ padding: "20px 28px 24px" }}>
              {/* To */}
              <div style={{ marginBottom: 16 }}>
                <label style={{ display: "block", fontSize: 11, fontWeight: 600, color: BRAND.muted, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>
                  Recipient Email *
                </label>
                <input
                  type="email"
                  value={emailTo}
                  onChange={(e) => setEmailTo(e.target.value)}
                  placeholder="doctor@practice.com"
                  disabled={emailStatus === "sending"}
                  style={{
                    width: "100%",
                    background: BRAND.inputBg,
                    border: "1px solid rgba(126,218,176,0.2)",
                    borderRadius: 8,
                    padding: "11px 14px",
                    color: BRAND.white,
                    fontSize: 14,
                    fontFamily: "'DM Sans', sans-serif",
                    outline: "none",
                    boxSizing: "border-box",
                  }}
                />
              </div>

              {/* Subject */}
              <div style={{ marginBottom: 16 }}>
                <label style={{ display: "block", fontSize: 11, fontWeight: 600, color: BRAND.muted, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>
                  Subject
                </label>
                <input
                  type="text"
                  value={emailSubject}
                  onChange={(e) => setEmailSubject(e.target.value)}
                  disabled={emailStatus === "sending"}
                  style={{
                    width: "100%",
                    background: BRAND.inputBg,
                    border: "1px solid rgba(126,218,176,0.2)",
                    borderRadius: 8,
                    padding: "11px 14px",
                    color: BRAND.white,
                    fontSize: 14,
                    fontFamily: "'DM Sans', sans-serif",
                    outline: "none",
                    boxSizing: "border-box",
                  }}
                />
              </div>

              {/* Note */}
              <div style={{ marginBottom: 20 }}>
                <label style={{ display: "block", fontSize: 11, fontWeight: 600, color: BRAND.muted, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>
                  Personal Note (optional)
                </label>
                <textarea
                  value={emailNote}
                  onChange={(e) => setEmailNote(e.target.value)}
                  placeholder="Hi, here's the LightForce efficiency analysis for your practice..."
                  disabled={emailStatus === "sending"}
                  rows={3}
                  style={{
                    width: "100%",
                    background: BRAND.inputBg,
                    border: "1px solid rgba(126,218,176,0.2)",
                    borderRadius: 8,
                    padding: "11px 14px",
                    color: BRAND.white,
                    fontSize: 14,
                    fontFamily: "'DM Sans', sans-serif",
                    outline: "none",
                    resize: "vertical",
                    boxSizing: "border-box",
                  }}
                />
              </div>

              {/* Preview Summary */}
              <div
                style={{
                  background: "rgba(126,218,176,0.05)",
                  border: "1px solid rgba(126,218,176,0.1)",
                  borderRadius: 10,
                  padding: "14px 16px",
                  marginBottom: 20,
                }}
              >
                <div style={{ fontSize: 11, fontWeight: 600, color: BRAND.aqua, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>
                  Report Preview — LightForce ({inputs.lfVisits} visits, {Math.round(calc.scenarios[2].reduction * 100)}% reduction)
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 20px", fontSize: 13 }}>
                  {(() => {
                    const sLF = calc.scenarios[2];
                    const vpvDelta = sLF.valuePerVisitNew - calc.valuePerVisitBaseline;
                    const profitDay = vpvDelta * 5;
                    const profitYear = profitDay * inputs.monthlyClinicDays * 12;
                    return [
                      ["Patients/Day Now", inputs.patientsPerDay, false],
                      ["Patients/Day After", Math.round(sLF.reducedPatientsPerDay), false],
                      ["Value/Visit Now", `$${Math.round(calc.valuePerVisitBaseline)}`, false],
                      ["Value/Visit After", `$${Math.round(sLF.valuePerVisitNew)}`, false],
                      ["Value/Visit Increase", `+$${Math.round(vpvDelta)}`, true],
                      ["Appts Saved/Yr", Math.round(sLF.apptsSavedYear).toLocaleString(), false],
                      ["Clinical Days Freed", (sLF.apptsSavedYear / inputs.patientsPerDay).toFixed(1), true],
                      ["Extra Profit/Day", `+$${Math.round(profitDay).toLocaleString()}`, true],
                      ["Extra Profit/Year", `+$${Math.round(profitYear).toLocaleString()}`, true],
                      ["Extra Starts/Yr", sLF.extraStarts.toFixed(1), false],
                      ["Extra Revenue/Yr", `$${Math.round(sLF.extraRevenue).toLocaleString()}`, true],
                    ].map(([label, val, highlight], idx) => (
                      <div key={idx} style={{ display: "flex", justifyContent: "space-between", padding: "3px 0" }}>
                        <span style={{ color: BRAND.muted }}>{label}</span>
                        <span style={{ color: highlight ? BRAND.gold : BRAND.mint, fontWeight: 600 }}>{val}</span>
                      </div>
                    ));
                  })()}
                </div>
              </div>

              {/* Error */}
              {emailError && (
                <div style={{ background: "rgba(255,107,107,0.1)", border: "1px solid rgba(255,107,107,0.25)", borderRadius: 8, padding: "10px 14px", marginBottom: 16, fontSize: 13, color: BRAND.coral }}>
                  {emailError}
                </div>
              )}

              {/* Success */}
              {emailStatus === "sent" && (
                <div style={{ background: "rgba(126,218,176,0.1)", border: "1px solid rgba(126,218,176,0.25)", borderRadius: 8, padding: "10px 14px", marginBottom: 16, fontSize: 13, color: BRAND.mint, display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 18 }}>✓</span> Email sent successfully to {emailTo}
                </div>
              )}

              {/* Send Button */}
              <button
                onClick={sendEmail}
                disabled={emailStatus === "sending" || emailStatus === "sent"}
                style={{
                  width: "100%",
                  padding: "13px 20px",
                  background: emailStatus === "sent"
                    ? "rgba(126,218,176,0.2)"
                    : emailStatus === "sending"
                    ? "rgba(126,218,176,0.15)"
                    : BRAND.gradient,
                  border: "none",
                  borderRadius: 10,
                  color: emailStatus === "sent" || emailStatus === "sending" ? BRAND.mint : BRAND.dark,
                  fontSize: 15,
                  fontWeight: 700,
                  cursor: emailStatus === "sending" || emailStatus === "sent" ? "default" : "pointer",
                  fontFamily: "'DM Sans', sans-serif",
                  transition: "all 0.25s",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  gap: 8,
                  opacity: emailStatus === "sending" ? 0.7 : 1,
                }}
              >
                {emailStatus === "sending" && (
                  <span style={{ display: "inline-block", animation: "spin 1s linear infinite", fontSize: 16 }}>⟳</span>
                )}
                {emailStatus === "idle" || emailStatus === "error" ? "Send Email Report" : emailStatus === "sending" ? "Sending via Gmail..." : "✓ Sent!"}
              </button>

              <style>{`@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`}</style>
            </div>
          </div>
        </div>
      )}

      {/* ── Footer ── */}
      <div
        style={{
          borderTop: "1px solid rgba(126,218,176,0.08)",
          padding: "20px 24px",
          textAlign: "center",
          marginTop: 40,
        }}
      >
        <div
          style={{
            fontSize: 11,
            color: BRAND.muted,
            maxWidth: 600,
            margin: "0 auto",
            lineHeight: 1.6,
          }}
        >
          Powered by{" "}
          <a
            href="https://lf.co"
            target="_blank"
            rel="noopener noreferrer"
            style={{ color: BRAND.aqua, textDecoration: "none" }}
          >
            LightForce Orthodontics
          </a>{" "}
          — The world's only fully custom 3D-printed bracket system.
          <br />
          Gaidge benchmarking data from 2023 YTD analysis. Results are
          estimates and will vary by practice.
        </div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(LightForceCalculator));
  </script>
</body>
</html>
