const fmt = (n, dec = 0) =>
  n != null && !isNaN(n)
    ? Number(n).toLocaleString("en-US", {
        minimumFractionDigits: dec,
        maximumFractionDigits: dec,
      })
    : "—";
const fmtCurrency = (n) => (n != null && !isNaN(n) ? `$${fmt(n)}` : "—");
const fmtPct = (n, dec = 1) =>

const SliderField = ({ label, value, onChange, min, max, step = 1, prefix, suffix, tooltip }) => {
  const pct = ((value - min) / (max - min)) * 100;
  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
        <label style={{ fontSize: 11, fontWeight: 600, color: BRAND.muted, letterSpacing: "0.04em", textTransform: "uppercase" }}>
          {label}
          {tooltip && <span title={tooltip} style={{ marginLeft: 5, cursor: "help", color: BRAND.aquaText, fontSize: 10 }}>ⓘ</span>}
        </label>
        <span style={{ fontSize: 18, fontWeight: 700, color: BRAND.mintText, fontFamily: "'DM Sans', sans-serif" }}>
          {prefix}{typeof value === 'number' ? value.toLocaleString() : value}{suffix}
        </span>
      </div>
      <div style={{ position: "relative", height: 28, display: "flex", alignItems: "center" }}>
        <div style={{ position: "absolute", left: 0, right: 0, height: 6, background: "rgba(126,218,176,0.08)", borderRadius: 3 }}>
          <div style={{ height: "100%", width: `${pct}%`, background: BRAND.gradient, borderRadius: 3, transition: "width 0.15s ease" }} />
        </div>
        <input
          type="range"
          min={min}
          max={max}
          step={step}
          value={value}
          onChange={(e) => onChange(Number(e.target.value))}
          style={{
            position: "absolute", left: 0, right: 0, width: "100%", height: 28,
            WebkitAppearance: "none", appearance: "none", background: "transparent",
            cursor: "pointer", margin: 0, outline: "none", zIndex: 2,
          }}
        />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "rgba(61,90,102,0.65)", marginTop: 2 }}>
        <span>{prefix}{min.toLocaleString()}{suffix}</span>
        <span>{prefix}{max.toLocaleString()}{suffix}</span>
      </div>
      <style>{`
        input[type=range]::-webkit-slider-thumb {
          -webkit-appearance: none; appearance: none;
          width: 20px; height: 20px; border-radius: 50%;
          background: linear-gradient(135deg, #7EDAB0, #5BC4C4);

const CompRow = ({ label, baseline, alignerBaseline, scenarios, format = "number" }) => {
  const formatVal = (v) => {
    if (v == null || isNaN(v)) return "—";
    if (format === "currency") return fmtCurrency(v);
    if (format === "percent") return fmtPct(v);
    if (format === "decimal1") return fmt(v, 1);
    return fmt(v);
  };
  return (
    <tr>
      <td
        style={{
          padding: "10px 12px",
          fontSize: 13,
          color: BRAND.muted,
          borderBottom: "1px solid rgba(126,218,176,0.06)",
          fontWeight: 500,
        }}
      >
        {label}
      </td>
      <td
        style={{
          padding: "10px 12px",
          fontSize: 14,
          color: BRAND.white,
          fontWeight: 600,
          textAlign: "right",
          borderBottom: "1px solid rgba(126,218,176,0.06)",
          fontFamily: "'DM Sans', sans-serif",

      >
        {formatVal(baseline)}
      </td>
      {alignerBaseline !== undefined && (
        <td
          style={{
            padding: "10px 12px",
            fontSize: 14,
            color: BRAND.seafoamText,
            fontWeight: 600,
            textAlign: "right",
            borderBottom: "1px solid rgba(126,218,176,0.06)",
            fontFamily: "'DM Sans', sans-serif",
          }}
        >
          {formatVal(alignerBaseline)}
        </td>
      )}
      {scenarios.map((s, i) => (
        <td
          key={i}
          style={{
            padding: "10px 12px",
            fontSize: 14,
            color: i === scenarios.length - 1 ? BRAND.goldText : BRAND.mintText,
            fontWeight: 600,
            textAlign: "right",
            borderBottom: "1px solid rgba(126,218,176,0.06)",
            fontFamily: "'DM Sans', sans-serif",
          }}
        >
          {formatVal(s)}
        </td>
      ))}
    </tr>
  );
};

// ═════════════════════════════════════════════════════════════════
// MAIN COMPONENT
// ═════════════════════════════════════════════════════════════════
function LightForceCalculator() {
  const [tab, setTab] = useState("calculator");
  const [animate, setAnimate] = useState(false);
  const [emailModal, setEmailModal] = useState(false);
  const [emailTo, setEmailTo] = useState("");
  const [emailSubject, setEmailSubject] = useState("LightForce Treatment Efficiency Report");
  const [emailNote, setEmailNote] = useState("");
  const [emailStatus, setEmailStatus] = useState("idle"); // idle | sending | sent | error
  const [emailError, setEmailError] = useState("");
  const [practiceName, setPracticeName] = useState("");

  // ── Inputs (from the Inputs tab of the spreadsheet) ──
  const [inputs, setInputs] = useState({
    patientsPerDay: 80,
    avgTreatmentFee: 9000,
    startsPerYear: 450,
    avgTxDuration: 24,
    avgVisits: 18,
    lfVisits: 12,
    // Appointment Durations (internal)
    initialConsult: 60,
    preBonding: 30,
    bonding: 60,
    interval: 30,
    finishing: 30,
    debond: 60,
    // Financial
    avgFeeAdjustment: 0.05,
    // Schedule
    monthlyClinicDays: 16,
  });

  // Fixed constants
  const CLINICAL_HOURS = 8;

  const update = (key) => (val) =>
    setInputs((p) => ({ ...p, [key]: val }));

  useEffect(() => {
    setAnimate(true);
    const t = setTimeout(() => setAnimate(false), 600);
    return () => clearTimeout(t);
  }, [inputs]);

  // Keep LightForce Visits within its dynamic max (avgVisits - 1) whenever
  // Avg Visits is lowered, so the LF Visits slider never renders out of range.
  useEffect(() => {
    const maxLfVisits = Math.max(8, inputs.avgVisits - 1);
    if (inputs.lfVisits > maxLfVisits) {
      setInputs((p) => ({ ...p, lfVisits: maxLfVisits }));
    }
  }, [inputs.avgVisits]);

  // ── Derived Calculations ──
  const calc = useMemo(() => {
    const i = inputs;
    const patientsPerDay = i.patientsPerDay;
    const apptCapDay = patientsPerDay;
    const apptCapMonth = apptCapDay * i.monthlyClinicDays;
    const activePatients = (i.startsPerYear / 12) * i.avgTxDuration;
    const totalApptsMonth = activePatients * (i.avgVisits / i.avgTxDuration);

    const reductions = [0.2, 0.4];
    const lfVisitsClamped = Math.min(Math.max(i.lfVisits, 1), i.avgVisits - 0.1);
    const lfReduction = (i.avgVisits - lfVisitsClamped) / i.avgVisits;
    const allScenarios = [...reductions, lfReduction];
    const scenarios = allScenarios.map((r, idx) => {
      const newDuration = i.avgTxDuration * (1 - r);
      const newVisits = i.avgVisits * (1 - r);

      // Total time per patient (current)
      const currentTotalTime =
        i.initialConsult +
        i.preBonding +
        i.bonding +
        i.interval * (i.avgVisits - 3) +
        i.finishing +
        i.debond;

      // LF model
      const lfIntervalTime = i.interval * 0.5;

      const valuePerVisitNew = avgCollection / newVisits;
      const profitPerVisitDelta = valuePerVisitNew - valuePerVisitBaseline;

      const extraRevenue = extraStarts * i.avgTreatmentFee;

      const lfProfitPerPatient = i.avgTreatmentFee;

      const lfProfitPerVisit = lfProfitPerPatient / newVisits;

        lfProfitPerPatient,
        currentProfitPerVisit,
        lfProfitPerVisit,
        currentProfitPerHour,
        lfProfitPerHour,
      };
    });

    const valuePerVisitBaseline = avgCollection / i.avgVisits;

To: ${emailTo.trim()}
Subject: ${emailSubject}
Body (send as HTML email): 
${htmlBody}

Please send this email now. The body is HTML formatted and should be sent as an HTML email, not plain text.`;

        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }],
          mcp_servers: [{ type: "url", url: "https://gmail.mcp.claude.com/mcp", name: "gmail-mcp" }],
        }),
      });
      const data = await response.json();
      
      const hasError = data.content?.some(
        (b) => b.type === "text" && (b.text?.toLowerCase().includes("error") || b.text?.toLowerCase().includes("failed"))
      );
      const hasToolResult = data.content?.some((b) => b.type === "mcp_tool_result");
      
      if (hasToolResult || (data.content && !hasError)) {

                      padding: "12px 14px",
                      border: "1px solid rgba(126,218,176,0.08)",
                    }}
                  >
                    <div
                      style={{
                        fontSize: 10,
                        color: BRAND.muted,
                        textTransform: "uppercase",
                        letterSpacing: "0.05em",
                      }}
                    >
                      Avg Emergency Rate
                    </div>
                    <div
                      style={{
                        fontSize: 20,
                        fontWeight: 700,
                        color: BRAND.aquaText,
                        marginTop: 2,
                      }}
                    >
                      {fmtPct(avgEmergencyRate)}
                    </div>
                  </div>
                  <div
                    style={{
                      background: "rgba(126,218,176,0.06)",
                      borderRadius: 10,
                      padding: "12px 14px",
                      border: "1px solid rgba(126,218,176,0.08)",
                    }}
                  >
                    <div
                      style={{
                        fontSize: 10,
                        color: BRAND.muted,
                        textTransform: "uppercase",
                        letterSpacing: "0.05em",
                      }}
                    >
                      Avg Monthly ER Visits
                    </div>
                    <div
                      style={{
                        fontSize: 20,
                        fontWeight: 700,
                        color: BRAND.aquaText,
                        marginTop: 2,
                      }}
                    >
                      {Math.round(
                        GAIDGE_BENCHMARKS.emergencyTrends.reduce(
                          (s, d) => s + d.emergency,
                          0
                        ) / GAIDGE_BENCHMARKS.emergencyTrends.length
                      )}
                    </div>
                  </div>
                </div>

                {/* LF Impact Note */}
                <div
                  style={{
                    marginTop: 16,
                    padding: "12px 16px",
                    background: "rgba(240,199,94,0.06)",
                    border: "1px solid rgba(240,199,94,0.15)",
                    borderRadius: 10,
                  }}
                >
                  <div
                    style={{
                      fontSize: 12,
                      color: BRAND.goldText,
                      fontWeight: 600,
                      marginBottom: 4,
                    }}
                  >
                    LightForce Impact on Emergencies
                  </div>
                  <div
                    style={{
                      fontSize: 12,
                      color: BRAND.muted,
                      lineHeight: 1.5,
                    }}
                  >
                    Custom 3D-printed brackets reduce bracket failures
                    and emergency visits. LightForce practices typically
                    see significantly fewer unscheduled appointments,
                    freeing chair time for productive visits.
                  </div>
                </div>
              </div>
            </div>

            {/* Full Benchmark Comparison */}
            <div
              style={{
                background: BRAND.cardBg,
                border: "1px solid rgba(126,218,176,0.1)",
                borderRadius: 16,
                padding: 24,
                backdropFilter: "blur(10px)",
              }}
            >
              <SectionHeader
                title="Your Practice vs Gaidge Benchmarks with LightForce"
                subtitle="See how LightForce efficiency gains compare to industry benchmarks across treatment types"
              />

              <div style={{ overflowX: "auto" }}>
                <table
                  style={{
                    width: "100%",
                    borderCollapse: "collapse",
                  }}
                >
                  <thead>
                    <tr>
                      {[
                        "",
                        "Gaidge Avg",
                        "Gaidge Avg Aligners",
                        "Your Practice",
                        "With LF (20%)",
                        "With LF (40%)",
                        `LightForce (${inputs.lfVisits} visits)`,
                      ].map((h, i) => (
                        <th
                          key={h}
                          style={{
                            textAlign: i === 0 ? "left" : "right",
                            padding: "10px 12px",
                            fontSize: 11,
                            color:
                              i === 6 ? BRAND.goldText : i === 2 ? BRAND.seafoamText : i >= 4 ? BRAND.mintText : BRAND.muted,
                            textTransform: "uppercase",
                            letterSpacing: "0.06em",
                            borderBottom: `2px solid rgba(126,218,176,0.15)`,
                            fontWeight: 600,
                            whiteSpace: "nowrap",
                          }}
                        >
                          {h}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    <CompRow
                      label="Treatment Duration (months)"
                      baseline={26}
                      alignerBaseline={GAIDGE_BENCHMARKS.txTypes.find((t) => t.type === "Aligner").months}
                      scenarios={[
                        inputs.avgTxDuration,
                        calc.scenarios[0].newDuration,
                        calc.scenarios[1].newDuration,
                        calc.scenarios[2].newDuration,
                      ]}
                      format="decimal1"
                    />
                    <CompRow
                      label="Total Visits"
                      baseline={19}
                      alignerBaseline={GAIDGE_BENCHMARKS.txTypes.find((t) => t.type === "Aligner").visits}
                      scenarios={[
                        inputs.avgVisits,
                        calc.scenarios[0].newVisits,
                        calc.scenarios[1].newVisits,
                        calc.scenarios[2].newVisits,
                      ]}
                      format="decimal1"
                    />
                    <CompRow
                      label="Value per Visit"
                      baseline={391}
                      alignerBaseline={GAIDGE_BENCHMARKS.txTypes.find((t) => t.type === "Aligner").valuePerVisit}
                      scenarios={[
                        calc.valuePerVisitBaseline,
                        calc.scenarios[0].valuePerVisitNew,
                        calc.scenarios[1].valuePerVisitNew,
                        calc.scenarios[2].valuePerVisitNew,
                      ]}
                      format="currency"
                    />
                    <CompRow
                      label="Appts Saved / Year"
                      baseline={"—"}
                      alignerBaseline={"—"}
                      scenarios={[
                        "—",
                        calc.scenarios[0].apptsSavedYear,
                        calc.scenarios[1].apptsSavedYear,
                        calc.scenarios[2].apptsSavedYear,
                      ]}
                    />
                    <CompRow
                      label="Extra Revenue / Year"
                      baseline={"—"}
                      alignerBaseline={"—"}
                      scenarios={[
                        "—",
                        calc.scenarios[0].extraRevenue,
                        calc.scenarios[1].extraRevenue,
                        calc.scenarios[2].extraRevenue,
                      ]}
                      format="currency"
                    />
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* ── Email Modal ── */}
      {emailModal && (
        <div
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(0,0,0,0.7)",
            backdropFilter: "blur(6px)",
            zIndex: 1000,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            padding: 20,
          }}
          onClick={(e) => { if (e.target === e.currentTarget && emailStatus !== "sending") setEmailModal(false); }}
        >
          <div
            style={{
              background: `linear-gradient(165deg, ${BRAND.navy}, ${BRAND.dark})`,
              border: "1px solid rgba(126,218,176,0.2)",
              borderRadius: 18,
              padding: 0,
              width: "100%",
              maxWidth: 560,
              maxHeight: "90vh",
              overflow: "auto",
              boxShadow: "0 24px 80px rgba(0,0,0,0.5)",
            }}
          >
            {/* Modal Header */}
            <div
              style={{
                padding: "22px 28px 16px",
                borderBottom: "1px solid rgba(126,218,176,0.1)",
                display: "flex",
                alignItems: "center",
                justifyContent: "space-between",
              }}
            >
              <div>
                <h2
                  style={{
                    margin: 0,
                    fontSize: 18,
                    fontWeight: 700,
                    color: BRAND.white,
                    fontFamily: "'DM Sans', sans-serif",
                    display: "flex",
                    alignItems: "center",
                    gap: 8,
                  }}
                >
                  <span style={{ fontSize: 20 }}>✉</span> Email Efficiency Report
                </h2>
                <p style={{ margin: "4px 0 0", fontSize: 12, color: BRAND.muted }}>
                  Send the 40% reduction scenario with your practice inputs
                </p>
              </div>
              <button
                onClick={() => emailStatus !== "sending" && setEmailModal(false)}
                style={{
                  background: "rgba(126,218,176,0.1)",
                  border: "1px solid rgba(126,218,176,0.15)",
                  borderRadius: 8,
                  width: 32,
                  height: 32,
                  color: BRAND.muted,
                  fontSize: 16,
                  cursor: "pointer",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                }}
              >
                ✕
              </button>
            </div>

            {/* Modal Body */}
            <div style={{ padding: "20px 28px 24px" }}>
              {/* To */}
              <div style={{ marginBottom: 16 }}>
                <label style={{ display: "block", fontSize: 11, fontWeight: 600, color: BRAND.muted, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>
                  Recipient Email *
                </label>
                <input
                  type="email"
                  value={emailTo}
                  onChange={(e) => setEmailTo(e.target.value)}
                  placeholder="doctor@practice.com"
                  disabled={emailStatus === "sending"}
                  style={{
                    width: "100%",
                    background: BRAND.inputBg,
                    border: "1px solid rgba(126,218,176,0.2)",
                    borderRadius: 8,
                    padding: "11px 14px",
                    color: BRAND.white,
                    fontSize: 14,
                    fontFamily: "'DM Sans', sans-serif",
                    outline: "none",
                    boxSizing: "border-box",
                  }}
                />
              </div>

              {/* Subject */}
              <div style={{ marginBottom: 16 }}>
                <label style={{ display: "block", fontSize: 11, fontWeight: 600, color: BRAND.muted, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>
                  Subject
                </label>
                <input
                  type="text"
                  value={emailSubject}
                  onChange={(e) => setEmailSubject(e.target.value)}
                  disabled={emailStatus === "sending"}
                  style={{
                    width: "100%",
                    background: BRAND.inputBg,
                    border: "1px solid rgba(126,218,176,0.2)",
                    borderRadius: 8,
                    padding: "11px 14px",
                    color: BRAND.white,
                    fontSize: 14,
                    fontFamily: "'DM Sans', sans-serif",
                    outline: "none",
                    boxSizing: "border-box",
                  }}
                />
              </div>

              {/* Note */}
              <div style={{ marginBottom: 20 }}>
                <label style={{ display: "block", fontSize: 11, fontWeight: 600, color: BRAND.muted, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>
                  Personal Note (optional)
                </label>
                <textarea
                  value={emailNote}
                  onChange={(e) => setEmailNote(e.target.value)}
                  placeholder="Hi, here's the LightForce efficiency analysis for your practice..."
                  disabled={emailStatus === "sending"}
                  rows={3}
                  style={{
                    width: "100%",
                    background: BRAND.inputBg,
                    border: "1px solid rgba(126,218,176,0.2)",
                    borderRadius: 8,
                    padding: "11px 14px",
                    color: BRAND.white,
                    fontSize: 14,
                    fontFamily: "'DM Sans', sans-serif",
                    outline: "none",
                    resize: "vertical",
                    boxSizing: "border-box",
                  }}
                />
              </div>

              {/* Preview Summary */}
              <div
                style={{
                  background: "rgba(126,218,176,0.05)",
                  border: "1px solid rgba(126,218,176,0.1)",
                  borderRadius: 10,
                  padding: "14px 16px",
                  marginBottom: 20,
                }}
              >
                <div style={{ fontSize: 11, fontWeight: 600, color: BRAND.aquaText, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>
                  Report Preview — LightForce ({inputs.lfVisits} visits, {Math.round(calc.scenarios[2].reduction * 100)}% reduction)
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 20px", fontSize: 13 }}>
                  {(() => {
                    const sLF = calc.scenarios[2];
                    const vpvDelta = sLF.valuePerVisitNew - calc.valuePerVisitBaseline;
                    const profitDay = vpvDelta * 5;
                    const profitYear = profitDay * inputs.monthlyClinicDays * 12;
                    return [
                      ["Patients/Day Now", inputs.patientsPerDay, false],
                      ["Patients/Day After", Math.round(sLF.reducedPatientsPerDay), false],
                      ["Value/Visit Now", `$${Math.round(calc.valuePerVisitBaseline)}`, false],
                      ["Value/Visit After", `$${Math.round(sLF.valuePerVisitNew)}`, false],
                      ["Value/Visit Increase", `+$${Math.round(vpvDelta)}`, true],
                      ["Appts Saved/Yr", Math.round(sLF.apptsSavedYear).toLocaleString(), false],
                      ["Clinical Days Freed", (sLF.apptsSavedYear / inputs.patientsPerDay).toFixed(1), true],
                      ["Extra Profit/Day", `+$${Math.round(profitDay).toLocaleString()}`, true],
                      ["Extra Profit/Year", `+$${Math.round(profitYear).toLocaleString()}`, true],
                      ["Extra Starts/Yr", sLF.extraStarts.toFixed(1), false],
                      ["Extra Revenue/Yr", `$${Math.round(sLF.extraRevenue).toLocaleString()}`, true],
                    ].map(([label, val, highlight], idx) => (
                      <div key={idx} style={{ display: "flex", justifyContent: "space-between", padding: "3px 0" }}>
                        <span style={{ color: BRAND.muted }}>{label}</span>
                        <span style={{ color: highlight ? BRAND.goldText : BRAND.mintText, fontWeight: 600 }}>{val}</span>
                      </div>
                    ));
                  })()}
                </div>
              </div>

              {/* Error */}
              {emailError && (
                <div style={{ background: "rgba(255,107,107,0.1)", border: "1px solid rgba(255,107,107,0.25)", borderRadius: 8, padding: "10px 14px", marginBottom: 16, fontSize: 13, color: BRAND.coralText }}>
                  {emailError}
                </div>
              )}

              {/* Success */}
              {emailStatus === "sent" && (
                <div style={{ background: "rgba(126,218,176,0.1)", border: "1px solid rgba(126,218,176,0.25)", borderRadius: 8, padding: "10px 14px", marginBottom: 16, fontSize: 13, color: BRAND.mintText, display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 18 }}>✓</span> Email sent successfully to {emailTo}
                </div>
              )}

              {/* Send Button */}
              <button
                onClick={sendEmail}
                disabled={emailStatus === "sending" || emailStatus === "sent"}
                style={{
                  width: "100%",
                  padding: "13px 20px",
                  background: emailStatus === "sent"
                    ? "rgba(126,218,176,0.2)"
                    : emailStatus === "sending"
                    ? "rgba(126,218,176,0.15)"
                    : BRAND.gradient,
                  border: "none",
                  borderRadius: 10,
                  color: emailStatus === "sent" || emailStatus === "sending" ? BRAND.mintText : BRAND.ink,
                  fontSize: 15,
                  fontWeight: 700,
                  cursor: emailStatus === "sending" || emailStatus === "sent" ? "default" : "pointer",
                  fontFamily: "'DM Sans', sans-serif",
                  transition: "all 0.25s",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  gap: 8,
                  opacity: emailStatus === "sending" ? 0.7 : 1,
                }}
              >
                {emailStatus === "sending" && (
                  <span style={{ display: "inline-block", animation: "spin 1s linear infinite", fontSize: 16 }}>⟳</span>
                )}
                {emailStatus === "idle" || emailStatus === "error" ? "Send Email Report" : emailStatus === "sending" ? "Sending via Gmail..." : "✓ Sent!"}
              </button>

              <style>{`@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`}</style>
            </div>
          </div>
        </div>
      )}

      {/* ── Footer ── */}
      <div
        style={{
          borderTop: "1px solid rgba(126,218,176,0.08)",
          padding: "20px 24px",
          textAlign: "center",
          marginTop: 40,
        }}
      >
        <div
          style={{
            fontSize: 11,
            color: BRAND.muted,
            maxWidth: 600,
            margin: "0 auto",
            lineHeight: 1.6,
          }}
        >
          Powered by{" "}
          <a
            href="https://lf.co"
            target="_blank"
            rel="noopener noreferrer"
            style={{ color: BRAND.aquaText, textDecoration: "none" }}
          >
            LightForce Orthodontics
          </a>{" "}
          — The world's only fully custom 3D-printed bracket system.
          <br />
          Gaidge benchmarking data from 2023 YTD analysis. Results are
          estimates and will vary by practice.
        </div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(LightForceCalculator));
  </script>
</body>
</html>
